<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4A5568"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#C0392B"/></marker>
    <style>
      .t{font:700 26px Arial;fill:#1A202C}.s{font:400 15px Arial;fill:#4A5568}
      .h{font:700 16px Arial;fill:#1A202C}.b{font:400 13px Arial;fill:#2D3748}.m{font:400 12px Arial;fill:#718096}
      .ln{stroke:#4A5568;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .em{stroke:#C0392B;stroke-width:2.5;fill:none;marker-end:url(#r);stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1240" height="560" fill="#FAFBFC"/>
  <text x="50" y="52" class="t">From proposal to execution</text>
  <text x="50" y="80" class="s">The standard path for every Orbs DAO decision, plus the narrow emergency branch</text>

  <rect x="50" y="130" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#5B78D1" stroke-width="2"/>
  <text x="72" y="165" class="h">1. Propose</text>
  <text x="72" y="192" class="b">OIP drafted and discussed</text>
  <text x="72" y="214" class="m">Discord, Telegram, GitHub</text>

  <rect x="310" y="130" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#5B78D1" stroke-width="2"/>
  <text x="332" y="165" class="h">2. Vote</text>
  <text x="332" y="192" class="b">Snapshot vote by staked</text>
  <text x="332" y="214" class="b">ORBS holders, OIP-0 rules</text>

  <rect x="570" y="130" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#5B78D1" stroke-width="2"/>
  <text x="592" y="165" class="h">3. Finalise</text>
  <text x="592" y="192" class="b">Quorum and result checked,</text>
  <text x="592" y="214" class="b">outcome recorded</text>

  <rect x="830" y="130" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#2F9E5F" stroke-width="2"/>
  <text x="852" y="165" class="h">4. Prepare</text>
  <text x="852" y="192" class="b">Multisig payload built and</text>
  <text x="852" y="214" class="b">verified against the OIP</text>

  <rect x="830" y="330" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#2F9E5F" stroke-width="2"/>
  <text x="852" y="365" class="h">5. Sign</text>
  <text x="852" y="392" class="b">Threshold of signers</text>
  <text x="852" y="414" class="b">independently approve</text>

  <rect x="570" y="330" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#2F9E5F" stroke-width="2"/>
  <text x="592" y="365" class="h">6. Execute</text>
  <text x="592" y="392" class="b">Transaction runs on-chain</text>
  <text x="592" y="414" class="m">Ethereum or Polygon</text>

  <rect x="310" y="330" width="200" height="110" rx="12" fill="#FFFFFF" stroke="#C77F2E" stroke-width="2"/>
  <text x="332" y="365" class="h">7. Publish</text>
  <text x="332" y="392" class="b">Tx hash and outcome added</text>
  <text x="332" y="414" class="b">to the public record</text>

  <rect x="50" y="330" width="200" height="110" rx="12" fill="#FDF1F0" stroke="#C0392B" stroke-width="2"/>
  <text x="72" y="365" class="h">Emergency branch</text>
  <text x="72" y="392" class="b">Act first only to prevent loss,</text>
  <text x="72" y="414" class="b">then ratify via Snapshot</text>

  <path d="M250 185 L310 185" class="ln"/>
  <path d="M510 185 L570 185" class="ln"/>
  <path d="M770 185 L830 185" class="ln"/>
  <path d="M930 240 L930 330" class="ln"/>
  <path d="M830 385 L770 385" class="ln"/>
  <path d="M510 385 L450 385" class="ln"/>
  <path d="M150 330 C150 280 250 250 310 210" class="em"/>
  <text x="50" y="510" class="m">Emergency actions skip the vote only when delay would cause material harm. They must be brought to Snapshot for ratification as soon as practicable.</text>
</svg>